name: CI

on:
    push:
    pull_request:
        branches:
            - main
            - develop
jobs:
    Build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Setup Java
              uses: actions/setup-java@v5
              with:
                  java-version: 25
                  distribution: "temurin"
            - name: Build
              run: ./gradlew build
            - name: Coverage
              run: ./gradlew jacocoTestCoverageVerification
